[project]
name = "pychronicle"
version = "0.1.0"
description = "AST-powered time-travel debugger for Python"
requires-python = ">=3.11"

dependencies = [
    "textual>=0.60.0",
    "typer[all]>=0.12.0"
]

[project.scripts]
pychronicle = "pychronicle.cli.main:app"


[tool.black]
line-length = 88

[tool.ruff]
line-length = 88